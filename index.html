<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" placeholder="Enter City name" spellcheck="false" />
        <button><img src="images/search.png" /></button>
        <button id="getLocation">
          <img
            src="images/Computer Icons Location Montana PNG.jpg"
            class="locationImage"
          />
        </button>
      </div>
      <div class="error">
        <p>Invalid city name</p>
      </div>
      <div class="weather">
        <img src="images/rain.png" class="weather-icon" />
        <h1 class="temp">22°C</h1>
        <h2 class="city">Winnipeg</h2>
        <h5 class="feelsLike">Feels like 3°C</h5>

        <div class="details">
          <div class="col">
            <img src="images/humidity.png" />
            <div>
              <p class="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <img src="images/wind.png" />
            <div>
              <p class="wind">20 km/hr</p>
              <p>Wind speed</p>
            </div>
          </div>
          <div class="col">
            <img src="images/fresh-air.png" />
            <div>
              <p class="pressure">1015 hPa</p>
              <p>Pressure</p>
            </div>
          </div>
          <div class="col">
            <img src="images/visibility.png" />
            <div>
              <p class="visibility">10 km</p>
              <p>Visibility</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const apiKey = "49f32d3e55bda17e17e61a6183b7d40f";
      const apiUrl =
        "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";
      const search = document.querySelector(".search input");
      const searchButton = document.querySelector(".search button");
      const weatherIcon = document.querySelector(".weather-icon");
      const locationButton = document.getElementById("getLocation");

      function gotLocation(position) {
        const { latitude, longitude } = position.coords;
        checkWeatherByCoords(latitude, longitude);
      }

      function failedToGet() {
        console.log("There was some issue");
        document.querySelector(".error").style.display = "block";
        document.querySelector(".weather").style.display = "none";
      }

      locationButton.addEventListener("click", async () => {
        navigator.geolocation.getCurrentPosition(gotLocation, failedToGet);
      });
      async function checkWeatherByCoords(lat, lon) {
        const response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`,
        );
        if (response.status == 404) {
          document.querySelector(".error").style.display = "block";
          document.querySelector(".weather").style.display = "none";
        } else {
          var data = await response.json();
          document.querySelector(".city").innerHTML = data.name;
          document.querySelector(".temp").innerHTML =
            Math.round(data.main.temp) + "°C";
          document.querySelector(".humidity").innerHTML =
            data.main.humidity + "%";
          document.querySelector(".wind").innerHTML =
            data.wind.speed + " km/hr";
          document.querySelector(".feelsLike").innerHTML =
            "Feels like " + Math.round(data.main.feels_like) + "°C";
          document.querySelector(".pressure").innerHTML =
            data.main.pressure + " hPa";
          document.querySelector(".visibility").innerHTML =
            data.visibility / 1000 + " km";

          if (data.weather[0].main == "Clouds") {
            weatherIcon.src = "images/clouds.png";
          } else if (data.weather[0].main == "Clear") {
            weatherIcon.src = "images/clear.png";
          } else if (data.weather[0].main == "Rain") {
            weatherIcon.src = "images/rain.png";
          } else if (data.weather[0].main == "Drizzle") {
            weatherIcon.src = "images/drizzle.png";
          } else if (data.weather[0].main == "Mist") {
            weatherIcon.src = "images/mist.png";
          }
          document.querySelector(".error").style.display = "none";
          document.querySelector(".weather").style.display = "block";
        }
      }

      async function checkWeather(city) {
        const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
        if (response.status == 404) {
          document.querySelector(".error").style.display = "block";
          document.querySelector(".weather").style.display = "none";
        } else {
          var data = await response.json();
          document.querySelector(".city").innerHTML = data.name;
          document.querySelector(".temp").innerHTML =
            Math.round(data.main.temp) + "°C";
          document.querySelector(".humidity").innerHTML =
            data.main.humidity + "%";
          document.querySelector(".wind").innerHTML =
            data.wind.speed + " km/hr";
          document.querySelector(".feelsLike").innerHTML =
            "Feels like " + Math.round(data.main.feels_like) + "°C";
          document.querySelector(".pressure").innerHTML =
            data.main.pressure + " hPa";
          document.querySelector(".visibility").innerHTML =
            data.visibility / 1000 + " km";

          if (data.weather[0].main == "Clouds") {
            weatherIcon.src = "images/clouds.png";
          } else if (data.weather[0].main == "Clear") {
            weatherIcon.src = "images/clear.png";
          } else if (data.weather[0].main == "Rain") {
            weatherIcon.src = "images/rain.png";
          } else if (data.weather[0].main == "Drizzle") {
            weatherIcon.src = "images/drizzle.png";
          } else if (data.weather[0].main == "Mist") {
            weatherIcon.src = "images/mist.png";
          }
          document.querySelector(".error").style.display = "none";
          document.querySelector(".weather").style.display = "block";
        }
      }
      searchButton.addEventListener("click", () => {
        checkWeather(search.value);
      });
    </script>
  </body>
</html>
